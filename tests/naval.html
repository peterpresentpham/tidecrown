<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nation — Kiểm tra hải quân</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #081a23;
        color: #e3ecd9;
        font: 14px system-ui;
      }
      #world {
        position: fixed;
        inset: 0;
      }
      #tools {
        position: fixed;
        z-index: 20;
        left: 16px;
        top: 16px;
        max-width: 440px;
        padding: 16px;
        background: #112c31ed;
        border: 1px solid #698175;
        border-radius: 10px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        color: #b3c6b5;
        line-height: 1.6;
        margin: 8px 0;
      }
      button,
      select {
        font: inherit;
        padding: 9px;
        border: 1px solid #739581;
        border-radius: 5px;
        background: #294a42;
        color: #e2efc7;
        margin: 3px;
      }
      #result {
        font-size: 13px;
        white-space: pre-wrap;
        max-height: 170px;
        overflow: auto;
        margin-top: 9px;
      }
      #roster {
        position: fixed;
        bottom: 15px;
        left: 16px;
        z-index: 20;
        max-width: 550px;
        background: #142d32e8;
        border: 1px solid #516f68;
        border-radius: 8px;
        padding: 10px;
        font-size: 12px;
      }
      #roster span {
        display: inline-block;
        margin: 4px 8px;
      }
      .ally {
        color: #8dbdff;
      }
      .foe {
        color: #ff9e9e;
      }
      @media (max-width: 650px) {
        #tools {
          max-width: calc(100vw - 32px);
        }
        #roster {
          max-width: calc(100vw - 32px);
        }
      }
      .world-labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .world-labels button {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: auto;
        font: 10px system-ui;
        padding: 3px 6px;
      }
      .unit-marker.player,
      .city-label.player {
        background: #205ba1;
        color: white;
      }
      .unit-marker.enemy,
      .city-label.enemy {
        background: #9f3439;
        color: white;
      }
      .combat-float {
        position: absolute;
        top: 0;
        left: 0;
        font-size: 24px;
        font-weight: 800;
        white-space: nowrap;
        pointer-events: none;
        text-shadow: 0 2px 4px #111;
      }
    </style>
  </head>
  <body>
    <div id="world"></div>
    <section id="tools">
      <h1>AI vận tải — hộ tống và đổ bộ</h1>
      <p>
        Trang kiểm thử riêng. AI màu xanh để quan sát đội hình; đối thủ màu đỏ. Không đọc/ghi ván
        lưu.
      </p>
      <select id="scenario" aria-label="Tình huống chiến thuật"></select>
      <div>
        <button id="next">AI: một lệnh</button><button id="turn">AI: hết lượt</button
        ><button id="round">Vòng tiếp</button><button id="reset">Đặt lại</button>
      </div>
      <p id="intent"></p>
      <div id="result" role="status"></div>
    </section>
    <div id="roster"></div>
    <script type="module" src="./naval-visual.ts"></script>
  </body>
</html>
