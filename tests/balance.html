<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nation — Kiểm tra cân bằng</title><style>
*{box-sizing:border-box}body{margin:0;background:#081a23;color:#e3ecd9;font:14px system-ui}#world{position:fixed;inset:0}#tools{position:fixed;z-index:20;left:16px;top:16px;max-width:420px;padding:16px;background:#112c31ed;border:1px solid #698175;border-radius:10px}h1{font-size:18px;margin:0 0 8px}p{font-size:12px;color:#b3c6b5;line-height:1.6;margin:8px 0}button,select{font:inherit;max-width:100%;padding:9px;border:1px solid #739581;border-radius:5px;background:#294a42;color:#e2efc7;margin:3px}#summary{font-size:12px;white-space:pre-wrap;line-height:1.7;max-height:260px;overflow:auto}.world-labels{position:absolute;inset:0;pointer-events:none}.world-labels button{position:absolute;top:0;left:0;pointer-events:auto;font:10px system-ui;padding:3px 6px}.unit-marker.player,.city-label.player{background:#205ba1;color:white}.unit-marker.enemy,.city-label.enemy{background:#9f3439;color:white}.combat-float{position:absolute;font-size:24px;font-weight:800;pointer-events:none;text-shadow:0 2px 4px #111}</style></head><body><div id="world"></div><section id="tools"><h1>Ba hướng mở đầu — replay kiểm thử</h1><p>Phát lại các lệnh hợp lệ của sáu ván Vừa, cùng tài nguyên và sương mù. Trang riêng, không đọc/ghi ván lưu. Chưa thay thế chơi thử 25–40 phút.</p><select id="campaign" aria-label="Ván kiểm thử"></select><div><button id="next">Một lệnh</button><button id="turn">Lượt tiếp</button><button id="finish">Tới kết quả</button><button id="reset">Đặt lại</button></div><p id="status" role="status"></p><div id="summary"></div></section><script type="module" src="./balance-visual.ts"></script></body></html>
